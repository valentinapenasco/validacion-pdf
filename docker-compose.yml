name: validacion-pdf

services:
  validacion-pdf:
    build: .
    environment:
      CONSUL_ENABLED: "true"
      CONSUL_HTTP_ADDR: http://consul:8500
      CONSUL_HTTP_TOKEN_FILE: /run/secrets/consul_microservices_token
      CONSUL_SERVICE_ADDRESS: validacion-pdf
      CONSUL_SERVICE_PORT: "8000"
    secrets:
      - consul_microservices_token
    networks:
      - redutn
    restart: unless-stopped

networks:
  redutn:
    external: true
    name: redutn

secrets:
  consul_microservices_token:
    file: ../dockers/consul/generated/microservices.token
