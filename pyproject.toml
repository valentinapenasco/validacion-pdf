[project]
name = "validacion-pdf"
version = "1.0.3"
description = "Microservicio de validación de archivos PDF para el proyecto microservicios-pdf"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.136.0",
    "uvicorn[standard]==0.45.0",
    "pydantic==2.13.3",
    "pydantic-settings==2.14.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "black>=26.10.0",
    "httpx==0.28.1",
    "pytest==9.0.3",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
